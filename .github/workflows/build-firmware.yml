# Builds the Skiff firmware package (.fwsc) on GitHub's own computers: nothing to install at home.
# Runs by itself when files change, or by hand: Actions tab > "Build firmware" > Run workflow.
# The finished package is at the bottom of the run's page, under "Artifacts" (skiff-firmware).
name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SKIFF_VERSION: "2.6-chord4"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido

      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh

      - name: JieLi SDK (three files of it are used)
        run: |
          if [ -f sdk-files/cpu/wl82/tools/uboot.boot ]; then
            echo "Using the three SDK files kept in this repository (sdk-files/)"
            echo "AC79_SDK=$GITHUB_WORKSPACE/sdk-files" >> "$GITHUB_ENV"
            exit 0
          fi
          ok=""
          for i in 1 2 3; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            if git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"; then
              ok=1
              break
            fi
            echo "download attempt $i failed"
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::error::Could not download the JieLi SDK from gitee.com (3 tries). Fallback: keep the three SDK files in this repository, in sdk-files/cpu/wl82/tools/"
            exit 1
          fi
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Build
        run: sh build.sh --release "$SKIFF_VERSION"

      - name: Memory report
        run: |
          ls -l build/skiff-*.fwsc build/felucca.bin build/loader/ota.bin 2>/dev/null || true
          ls build/*.map 2>/dev/null && grep -E "POOL|XIP|RAM|NOINIT" build/*.map | head -20 || true

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: skiff-firmware
          path: |
            build/skiff-*.fwsc
            build/felucca.bin
          if-no-files-found: error

      # The installer reads old data with a converter built by Emscripten. If that cannot be set up, the page is made without it.
      - name: Emscripten (for the installer's converter)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 3.1.56
          "$HOME/emsdk/emsdk" activate 3.1.56
          . "$HOME/emsdk/emsdk_env.sh"
          sh web/conv/build.sh

      # Your own installer page (the public one installs only the released package): the same installer, with this package.
      - name: Make the installer page
        env:
          SITE_OPTIONAL: "1"
        run: python3 web/make_site.py "build/skiff-$SKIFF_VERSION.fwsc" "$SKIFF_VERSION" build/site

      - name: Upload the installer page
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      # The hardware-free tests. They do not stop the package from being kept (it is saved above).
      - name: Tests
        continue-on-error: true
        env:
          SOAK_MIN: "1"
          STRESS_FRAMES: "5000"
          STRESS_ASAN_FRAMES: "3000"
          SKIP_CPU_VALGRIND: "1"
        run: sh tests/run_tests.sh 2>&1 | tee test-log.txt

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-log.txt
          if-no-files-found: ignore

  # Puts the installer page on the web at https://<your-name>.github.io/skiff/ (needs Settings > Pages > Source: GitHub Actions)
  pages:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
